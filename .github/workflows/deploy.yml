name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 같은 서버에 두 배포가 겹치지 않게 직렬화한다. 진행 중인 배포는 취소하지 않고 대기시킨다.
concurrency:
  group: deploy-production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    name: Test, build, and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트가 깨진 코드는 이미지로 만들지 않는다. bootJar 도 이 단계에서 검증한다.
      - name: Test and build application jar
        run: ./gradlew test bootJar

      # 멀티스테이지 Dockerfile 이 이미지 안에서 bootJar 를 다시 빌드한다.
      # CI 의 jar 는 최종 아티팩트가 아니라 테스트 통과 증명이다.
      - name: Resolve image name
        run: echo "IMAGE_ID=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_ID }}:${{ github.sha }}
            ${{ env.IMAGE_ID }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: ssh-keyscan -p "$EC2_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create deployment bundle
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          test -n "$PROD_ENV"
          mkdir -p deploy-bundle
          cp docker-compose.prod.yml deploy-bundle/docker-compose.yml
          printf '%s\n' "$PROD_ENV" > deploy-bundle/.env

      - name: Upload compose and environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: /home/${{ secrets.EC2_USER }}/heddy-server-v2
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$EC2_PORT" deploy-bundle/docker-compose.yml "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -P "$EC2_PORT" deploy-bundle/.env "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/.env"

      - name: Pull and restart containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: /home/${{ secrets.EC2_USER }}/heddy-server-v2
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" << EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          APP_IMAGE_TAG="${{ github.sha }}" docker compose pull app
          APP_IMAGE_TAG="${{ github.sha }}" docker compose up -d --remove-orphans
          docker image prune -f
          EOF
