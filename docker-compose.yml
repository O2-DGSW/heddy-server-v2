services:
  postgres:
    image: postgres:16-alpine
    container_name: heddy-v2-postgres
    environment:
      POSTGRES_DB: heddy_v2
      POSTGRES_USER: heddy_v2
      POSTGRES_PASSWORD: heddy_v2
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heddy_v2 -d heddy_v2"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - heddy-v2-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: heddy-v2-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - heddy-v2-redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: heddy-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - heddy-v2-minio-data:/data

volumes:
  heddy-v2-postgres-data:
  heddy-v2-redis-data:
  heddy-v2-minio-data:
