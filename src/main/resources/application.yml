spring:
  application:
    name: heddy-server-v2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/heddy_v2}
    username: ${DB_USERNAME:heddy_v2}
    password: ${DB_PASSWORD:heddy_v2}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  storage:
    bucket: ${AWS_S3_BUCKET:heddy-local}
    region: ${AWS_S3_REGION:ap-northeast-2}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    # 업로드 URL 만료는 업로드 세션(files.expires_at)을 따른다. 조회 URL 만 여기서 정한다.
    download-url-ttl-seconds: 60
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout-seconds: 3
    read-timeout-seconds: 30
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-seconds: 3600
    refresh-token-seconds: 2592000
    reauthentication-token-seconds: 300
    consent-policy-version: ${CONSENT_POLICY_VERSION:2026-08-01}
    login:
      maximum-attempts: 5
      lock-seconds: 1800
    social:
      google-client-id: ${GOOGLE_CLIENT_ID:}
      kakao-app-id: ${KAKAO_APP_ID:}
      apple-client-id: ${APPLE_CLIENT_ID:}
    sms:
      development-webhook-url: ${SMS_DEVELOPMENT_WEBHOOK_URL:}
      solapi:
        enabled: ${SOLAPI_ENABLED:false}
        api-key: ${SOLAPI_API_KEY:}
        api-secret: ${SOLAPI_API_SECRET:}
        from: ${SOLAPI_FROM:}
