spring:
  application:
    name: heddy-server-v2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/heddy_v2}
    username: ${DB_USERNAME:heddy_v2}
    password: ${DB_PASSWORD:heddy_v2}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name,email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  storage:
    bucket: ${AWS_S3_BUCKET:heddy-local}
    region: ${AWS_S3_REGION:ap-northeast-2}
    endpoint: ${AWS_S3_ENDPOINT:}
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout-seconds: 3
    read-timeout-seconds: 30
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-seconds: 3600
    refresh-token-seconds: 2592000
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
    oauth2:
      redirect-base-url: ${FRONTEND_URL:http://localhost:3000}
    sms:
      development-webhook-url: ${SMS_DEVELOPMENT_WEBHOOK_URL:}
      solapi:
        enabled: ${SOLAPI_ENABLED:false}
        api-key: ${SOLAPI_API_KEY:}
        api-secret: ${SOLAPI_API_SECRET:}
        from: ${SOLAPI_FROM:}
