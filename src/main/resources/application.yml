spring:
  application:
    name: heddy-server-v2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/heddy_v2}
    username: ${DB_USERNAME:heddy_v2}
    password: ${DB_PASSWORD:heddy_v2}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  storage:
    bucket: ${AWS_S3_BUCKET:heddy-local}
    region: ${AWS_S3_REGION:ap-northeast-2}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    # 업로드 URL 만료는 업로드 세션(files.expires_at)을 따른다. 조회 URL 만 여기서 정한다.
    # 만료를 없앨 수는 없다. 버킷이 비공개라 Presigned GET URL 자체가 인증 수단이고,
    # 새어 나가면 로그인 없이 사진이 열린다. 다만 60초는 목록을 열어둔 채 스크롤하는
    # 정상 사용에도 짧아 이미지가 403 으로 깨졌다. 화면 체류 시간과 노출 창의 절충값이다.
    download-url-ttl-seconds: ${DOWNLOAD_URL_TTL_SECONDS:300}
    # 업로드 세션 수명. presign 부터 complete 까지 클라이언트가 직접 올릴 시간을 준다.
    upload-session-ttl-seconds: ${UPLOAD_SESSION_TTL_SECONDS:600}
  file-cleanup:
    enabled: ${FILE_CLEANUP_ENABLED:true}
    interval-ms: ${FILE_CLEANUP_INTERVAL_MS:60000}
    initial-delay-ms: ${FILE_CLEANUP_INITIAL_DELAY_MS:60000}
    pending-grace-seconds: ${FILE_CLEANUP_PENDING_GRACE_SECONDS:60}
    ready-grace-seconds: ${FILE_CLEANUP_READY_GRACE_SECONDS:86400}
    batch-size: ${FILE_CLEANUP_BATCH_SIZE:100}
  share:
    # 공유 링크의 앞부분. 발급한 토큰 원문을 붙여 201 응답으로 딱 한 번 내보낸다.
    public-base-url: ${SHARE_PUBLIC_BASE_URL:https://heddy.site/s}
  account-deletion:
    worker-delay-ms: ${ACCOUNT_DELETION_WORKER_DELAY_MS:5000}
    worker-initial-delay-ms: ${ACCOUNT_DELETION_WORKER_INITIAL_DELAY_MS:60000}
    # FAILED 재처리 정책. 최대 시도 횟수와 재시도 간격(백오프)을 분리해 설정한다.
    max-attempts: ${ACCOUNT_DELETION_MAX_ATTEMPTS:5}
    retry-backoff-seconds: ${ACCOUNT_DELETION_RETRY_BACKOFF_SECONDS:300}
    # 사용 완료 재인증 토큰 보존 기간과 purge 주기.
    used-token-retention-days: ${USED_REAUTHENTICATION_TOKEN_RETENTION_DAYS:30}
    token-purge-interval-ms: ${USED_REAUTHENTICATION_TOKEN_PURGE_INTERVAL_MS:3600000}
    token-purge-initial-delay-ms: ${USED_REAUTHENTICATION_TOKEN_PURGE_INITIAL_DELAY_MS:60000}
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout-seconds: 3
    read-timeout-seconds: 30
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-seconds: 3600
    refresh-token-seconds: 2592000
    reauthentication-token-seconds: 300
    consent-policy-version: ${CONSENT_POLICY_VERSION:2026-08-01}
    login:
      maximum-attempts: 5
      lock-seconds: 1800
    social:
      google-client-id: ${GOOGLE_CLIENT_ID:}
      kakao-app-id: ${KAKAO_APP_ID:}
      apple-client-id: ${APPLE_CLIENT_ID:}
    sms:
      development-webhook-url: ${SMS_DEVELOPMENT_WEBHOOK_URL:}
      solapi:
        enabled: ${SOLAPI_ENABLED:false}
        api-key: ${SOLAPI_API_KEY:}
        api-secret: ${SOLAPI_API_SECRET:}
        from: ${SOLAPI_FROM:}
